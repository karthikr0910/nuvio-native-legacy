name: Build Android APKs

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
      NUVIO_P2P_MOTOR: none
      NUVIO_APK_LITE: 1
      NUVIO_RUST_MKVCORE: 0
      NUVIO_ANDROID_CACHE: ${{ github.workspace }}/.cache/nuvio-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts and gradlew executable
        run: |
          chmod +x android/gradlew
          chmod +x tools/*.sh tools/android/*.sh tools/p2p-motor/*.sh 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android NDK, CMake 3.22.1 & System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build ffmpeg build-essential
          sudo chown -R runner:docker "$ANDROID_HOME"
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | "$SDK_MGR" --licenses || true
          "$SDK_MGR" --install "cmake;3.22.1" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            mkdir -p "$ANDROID_HOME/cmake/3.22.1/bin"
            ln -sf /usr/bin/cmake "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
            ln -sf /usr/bin/ninja "$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          else
            [ -f "$ANDROID_HOME/cmake/3.22.1/bin/ninja" ] || ln -sf /usr/bin/ninja "$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          fi
          echo "Verifying SDK directories:"
          for d in ndk/27.2.12479018 platforms/android-35 build-tools/35.0.0 cmake/3.22.1; do
            echo "  $ANDROID_HOME/$d: $([ -d "$ANDROID_HOME/$d" ] && echo OK || echo MISSING)"
          done

      - name: Cache Android build dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.NUVIO_ANDROID_CACHE }}
          key: android-deps-v1-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh') }}
          restore-keys: |
            android-deps-v1-

      - name: Prepare environment configuration
        run: |
          cat << 'EOF' > local.properties
          NUVIO_SUPABASE_URL=
          NUVIO_SUPABASE_ANON_KEY=
          TV_LOGIN_WEB_BASE_URL=
          EOF

      - name: Build Native Dependencies (curl, mbedtls, libjpeg, libwebp)
        run: |
          bash tools/android/deps.sh arm64-v8a armeabi-v7a

      - name: Build Android Lite APKs (arm64 and armv7)
        run: |
          bash -x tools/android.sh --debug-only

      - name: List generated APKs
        run: |
          ls -la build/android/*.apk

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-android-apks
          path: build/android/*.apk
