name: Build Android APKs

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NUVIO_P2P_MOTOR: none
      NUVIO_APK_LITE: 1
      NUVIO_RUST_MKVCORE: 0
      NUVIO_ANDROID_CACHE: ${{ github.workspace }}/.cache/nuvio-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Android build dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.NUVIO_ANDROID_CACHE }}
          key: android-deps-v1-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh') }}
          restore-keys: |
            android-deps-v1-

      - name: Prepare environment configuration
        run: |
          cat << 'EOF' > local.properties
          NUVIO_SUPABASE_URL=https://fixture.invalid
          NUVIO_SUPABASE_ANON_KEY=fixture-public
          TV_LOGIN_WEB_BASE_URL=https://fixture.invalid/login
          EOF

      - name: Build Native Dependencies (curl, mbedtls, libjpeg, libwebp)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018
          bash tools/android/deps.sh arm64-v8a armeabi-v7a

      - name: Build Android Lite APKs (arm64 and armv7)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018
          bash tools/android.sh --debug-only

      - name: List generated APKs
        run: |
          ls -la build/android/*.apk

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-android-apks
          path: build/android/*.apk
